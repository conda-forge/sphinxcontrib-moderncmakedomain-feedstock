{% set version = "4.4.3" %}

package:
  name: sphinxcontrib-moderncmakedomain
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/sphinxcontrib-moderncmakedomain/sphinxcontrib_moderncmakedomain-{{ version }}.tar.gz
  sha256: 23f80188bb241a4da6886f9e4b204dc62bae76060a41aa597b90f04d277410a8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - sphinx >=2

test:
  imports:
    - sphinxcontrib.moderncmakedomain
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/scikit-build/moderncmakedomain
  summary: Sphinx Domain for Modern CMake
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - awvwgk
